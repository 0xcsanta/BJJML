[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jjbml"
version = "0.1.0"
description = "Moteur de recommandation de mouvements en jiu-jitsu bresilien no-gi"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
# Les scripts de fetch n'utilisent que la bibliotheque standard : les sources
# se recuperent avant meme d'avoir installe quoi que ce soit.
# numpy et PyYAML servent au parser GrappleMap et a l'ontologie (phase 1).
dependencies = ["numpy>=1.26", "PyYAML>=6.0"]

[project.optional-dependencies]
# Phase 2 — premier modele
model = ["pandas", "scikit-learn", "torch", "matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
